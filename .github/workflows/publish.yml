name: Publish

# Runs when a vX.Y.Z tag is pushed: checks the tag matches lib/r2ui/version.rb and sits on main,
# runs the tests, builds the gem, pushes it to RubyGems with trusted publishing (OIDC, no API key)
# and creates the GitHub Release with the gem and the changelog section as notes.
# RubyGems' trusted publisher for r2ui names this file (publish.yml) and the "release"
# environment. See docs/releasing.md.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the version from the tag
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag '$TAG' isn't vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Check the tag matches version.rb, is on main and isn't already published
        run: |
          code=$(ruby -Ilib -e 'require "r2ui/version"; print R2UI::VERSION')
          if [ "$code" != "$VERSION" ]; then
            echo "::error::lib/r2ui/version.rb says $code but the tag is $TAG"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG ($(git rev-parse HEAD)) isn't on main"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/r2ui/versions/$VERSION.json")
          if [ "$status" = 200 ]; then
            echo "::error::r2ui $VERSION is already on RubyGems; refusing to publish it again (docs/releasing.md: finish the GitHub Release by hand)"
            exit 1
          elif [ "$status" != 404 ]; then
            echo "::error::couldn't ask RubyGems whether $VERSION exists (HTTP $status)"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          ruby -e '
            version = ENV.fetch("VERSION")
            notes = File.read("CHANGELOG.md")[/^## #{Regexp.escape(version)}[ \t]*\n(.*?)(?=^## |\z)/m, 1].to_s.strip
            abort "::error::CHANGELOG.md has no entries under \"## #{version}\"" if notes.empty?
            File.write(File.join(ENV.fetch("RUNNER_TEMP"), "notes.md"), notes + "\n")
          '

      - name: Run the tests
        run: bundle exec rake test

      - name: Build the gem
        run: gem build r2ui.gemspec --output "r2ui-$VERSION.gem"

      - name: Get a short-lived RubyGems key through trusted publishing
        uses: rubygems/configure-rubygems-credentials@v2.1.0 # no floating major tag

      - name: Push the gem to RubyGems
        run: gem push "r2ui-$VERSION.gem"

      - name: Create the GitHub Release
        run: |
          gh release create "$TAG" "r2ui-$VERSION.gem" \
            --verify-tag --title "r2ui $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
