name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  # release.yml starts this on a new release/hotfix branch: its GITHUB_TOKEN push can't trigger runs.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test
