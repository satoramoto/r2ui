name: Release

# Starts a release (from develop) or a hotfix (from main): creates release/X.Y.Z or hotfix/X.Y.Z,
# bumps lib/r2ui/version.rb, moves CHANGELOG.md's "## Unreleased" entries under "## X.Y.Z" and
# opens a PR into main. Merging that PR runs publish.yml. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v)"
        required: true
        type: string
      kind:
        description: "release: cut from develop. hotfix: cut from main (patch fixes only)"
        required: true
        type: choice
        options: [release, hotfix]
        default: release

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      KIND: ${{ inputs.kind }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate the version format
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must look like 1.2.3 (no leading v, no pre-release suffix); got '$VERSION'"
            exit 1
          fi
          if [ "$KIND" = hotfix ] && [[ "$VERSION" =~ \.0$ ]]; then
            echo "::error::a hotfix bumps the patch number, so it can't end in .0; got '$VERSION'"
            exit 1
          fi
          if [ "$KIND" = release ]; then
            echo "BASE=develop" >> "$GITHUB_ENV"
          else
            echo "BASE=main" >> "$GITHUB_ENV"
          fi
          echo "BRANCH=$KIND/$VERSION" >> "$GITHUB_ENV"

      - name: Check the base branch exists
        run: |
          if ! git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" "$BASE" > /dev/null; then
            echo "::error::branch '$BASE' doesn't exist; see the one-time setup in docs/releasing.md"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Check the version isn't released or in progress, and is newer than the last release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION already exists: $VERSION is already released"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/$VERSION" "hotfix/$VERSION" > /dev/null; then
            echo "::error::a release/$VERSION or hotfix/$VERSION branch already exists; finish or delete it first"
            exit 1
          fi
          curl -fsS https://rubygems.org/api/v1/versions/r2ui.json -o rubygems-versions.json
          git tag --list 'v*' > tags.txt
          ruby -rjson -e '
            version = Gem::Version.new(ENV.fetch("VERSION"))
            published = JSON.parse(File.read("rubygems-versions.json")).map { |v| v.fetch("number") }
            if published.include?(version.to_s)
              abort "::error::r2ui #{version} is already on RubyGems"
            end
            tagged = File.readlines("tags.txt", chomp: true).filter_map { |t| t.delete_prefix("v") if t.match?(/\Av\d+\.\d+\.\d+\z/) }
            latest = (published + tagged).map { |v| Gem::Version.new(v) }.max
            if latest && version <= latest
              abort "::error::#{version} must be newer than the latest release, #{latest}"
            end
            puts "Latest release: #{latest || "none"}; releasing #{version}"
          '
          rm rubygems-versions.json tags.txt

      - name: Bump lib/r2ui/version.rb and move the changelog's Unreleased entries under the version
        run: |
          git switch -c "$BRANCH"
          ruby -e '
            version = ENV.fetch("VERSION")
            path = "lib/r2ui/version.rb"
            src = File.read(path)
            bumped = src.sub(/VERSION = "[^"]*"/, %(VERSION = "#{version}"))
            abort "::error::no VERSION constant in #{path}" unless bumped.match?(/VERSION = "#{Regexp.escape(version)}"/)
            File.write(path, bumped)

            path = "CHANGELOG.md"
            log = File.read(path)
            abort "::error::CHANGELOG.md has no \"## Unreleased\" heading" unless log.match?(/^## Unreleased[ \t]*$/)
            unreleased = log[/^## Unreleased[ \t]*\n(.*?)(?=^## |\z)/m, 1].to_s.strip
            if unreleased.empty? && ENV.fetch("KIND") == "release"
              abort "::error::CHANGELOG.md has nothing under \"## Unreleased\"; there is nothing to release"
            end
            File.write(path, log.sub(/^## Unreleased[ \t]*\n/, "## Unreleased\n\n## #{version}\n"))
          '
          git diff

      - name: Push the branch and open the PR into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION: bump version, changelog"
          git push origin "HEAD:refs/heads/$BRANCH"
          if [ "$KIND" = release ]; then
            body="Release $VERSION, cut from develop. Check the CHANGELOG section, push any last fixes to \`$BRANCH\`, then merge: publish.yml tags v$VERSION, publishes the gem and merges main back into develop."
            gh pr create --base main --head "$BRANCH" --title "Release $VERSION" --body "$body"
          else
            body="Hotfix $VERSION, cut from main. Push the fix to \`$BRANCH\` with its entry under \`## $VERSION\` in CHANGELOG.md, mark this PR ready, then merge: publish.yml tags v$VERSION, publishes the gem and merges main back into develop."
            gh pr create --draft --base main --head "$BRANCH" --title "Hotfix $VERSION" --body "$body"
          fi

      # Pushes and PRs made with GITHUB_TOKEN don't trigger other workflows, so start the checks
      # on the new branch explicitly; their results show on the PR's head commit.
      - name: Run CI and conformance on the release branch
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run conformance.yml --ref "$BRANCH"
